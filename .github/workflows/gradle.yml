name: Laboratorio Final DevSecOps

on:
  push:
    branches: [ "feature_laboratorio_final" ]
  pull_request:
    branches: [ "feature_laboratorio_final" ]

jobs:
  SAST:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
     - name: Checkout repository
       uses: actions/checkout@v4

     - name: Set up JDK 11
       uses: actions/setup-java@v4
       with:
        java-version: '11'
        distribution: 'temurin'

     - name: Grant execute permission for gradlew
       run: chmod +x gradlew

    # - name: Setup Gradle
    #   uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

     - name: Initialize CodeQL
       uses: github/codeql-action/init@v3
       with:
          languages: java-kotlin
          build-mode: none
          queries: |
            security-and-quality

     - name: Build with Gradle Wrapper
       run: ./gradlew build
          
     - name: Perform CodeQL Analysis
       uses: github/codeql-action/analyze@v3
       with:
          category: "/language:java-kotlin"  
              

     - name: Wait for CodeQL processing
       run: sleep 40

     - name: Fail pipeline if vulnerabilities exist
       run: |

          echo "Checking CodeQL alerts..."

          curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/code-scanning/alerts?state=open" \
            | grep -E '"security_severity_level":"(medium|high|critical)"'

          if [ $? -eq 0 ]; then
            echo "Medium/High/Critical vulnerabilities detected"
            exit 1
          else
            echo "No vulnerabilities found"
          fi

